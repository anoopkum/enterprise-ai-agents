name: ML & App Deploy

on:
  push:
    branches: [main]
    paths:
      - "day-02-loan-underwriting/src/**"
      - "day-02-loan-underwriting/scripts/**"
      - "day-02-loan-underwriting/Dockerfile"
      - "day-02-loan-underwriting/requirements.txt"
  workflow_dispatch:
    inputs:
      retrain_model:
        description: "Force model retrain"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read


env:
  IMAGE_NAME: loan-underwriting
  RESOURCE_GROUP: rg-fraud-agent-staging
  ACR_NAME: acrloanunderwriting
  CONTAINER_APP_NAME: ca-loan-underwriting

jobs:
  # ─── Train model ──────────────────────────────────────────────────────────
  train:
    name: Train Model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-02-loan-underwriting

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide whether to retrain
        id: retrain
        run: |
          if [ "${{ github.event.inputs.retrain_model }}" == "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 2>/dev/null | grep -qE "scripts/train_model\.py|data/"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Train model
        if: steps.retrain.outputs.needed == 'true'
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlruns/mlflow.db"
        run: |
          mkdir -p mlruns models
          python3 scripts/train_model.py 2>&1 | tee train.log
          grep -E "ROC-AUC|Model saved|Top 5" train.log

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: credit-risk-model-${{ github.sha }}
          path: day-02-loan-underwriting/models/
          retention-days: 30

  # ─── Build & push to ACR ──────────────────────────────────────────────────
  build:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: train
    outputs:
      image_tag:        ${{ steps.meta.outputs.version }}
      image_digest:     ${{ steps.push.outputs.digest }}
      acr_login_server: ${{ steps.acr.outputs.login_server }}

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: credit-risk-model-${{ github.sha }}
          path: day-02-loan-underwriting/models/

      - uses: docker/setup-buildx-action@v3

      - uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Resolve ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show \
            --name ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query loginServer --output tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          az acr login --name "$LOGIN_SERVER"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push to ACR
        id: push
        uses: docker/build-push-action@v5
        with:
          context: day-02-loan-underwriting
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Snyk container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
          args: --severity-threshold=high --sarif-file-output=snyk-container.sarif
        continue-on-error: true

      - name: Upload container scan results
        if: hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container

  # ─── Deploy to dev ────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ needs.build.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }} \
            --output table

      - name: Wait for active revision
        run: |
          for i in $(seq 1 12); do
            STATUS=$(az containerapp revision list \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[0].properties.runningState" \
              --output tsv 2>/dev/null || echo "Waiting")
            echo "[$i/12] revision state: $STATUS"
            [ "$STATUS" == "Running" ] && break
            sleep 15
          done

      - name: Smoke test /health
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          curl --fail --retry 5 --retry-delay 10 "https://$APP_URL/health"

      - name: Job summary
        run: |
          echo "## Deploy dev complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ needs.build.outputs.image_digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

